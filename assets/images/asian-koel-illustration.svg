 <path d="M90 620Q95 490 210 450Q225 555 145 620Z"/><path d="M890 620Q830 500 740 495Q750 585 810 620Z"/>
</g>
<g stroke="#7c946f" stroke-width="5" fill="none" opacity=".9"><path d="M0 380Q280 330 500 395T1000 360"/><path d="M70 470Q260 430 380 490T740 470"/></g>
<ellipse cx="520" cy="495" rx="270" ry="28" fill="#263b32" opacity=".2" filter="url(#shadow)"/>
<!-- tail -->
<path d="M515 360Q625 400 770 565Q670 530 580 485Q520 430 470 405Z" fill="#182a25"/>
<path d="M540 365Q650 430 715 535Q625 475 550 430Z" fill="#30463a"/>
