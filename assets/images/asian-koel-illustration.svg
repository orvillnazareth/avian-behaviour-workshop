<!-- wing -->
<path d="M355 275Q420 275 490 325Q455 380 385 390Q345 360 355 275Z" fill="#1c3029"/>
<path d="M375 305Q418 328 457 349M365 330Q410 354 440 370" stroke="#4d6655" stroke-width="5" fill="none" opacity=".65"/>
<!-- neck/head -->
<path d="M420 275Q390 225 415 175Q445 135 500 150Q550 170 535 220Q520 270 470 285Z" fill="#172823"/>
<circle cx="485" cy="188" r="7" fill="#e75b45"/><circle cx="486" cy="188" r="3" fill="#f7d6a0"/>
