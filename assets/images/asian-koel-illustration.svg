 <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#263b32"/><stop offset="1" stop-color="#0f201c"/></linearGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<rect width="1000" height="620" rx="28" fill="url(#bg)"/>
<circle cx="770" cy="125" r="110" fill="#f5efcf" opacity=".65"/>
<g fill="#617e5d" opacity=".8">
