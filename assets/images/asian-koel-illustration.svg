<path d="M215 455Q245 400 280 405Q272 445 235 462M730 463Q755 405 800 415Q785 455 748 470" fill="#47684b"/>
<g font-family="Arial,sans-serif" fill="#203a31"><text x="55" y="535" font-size="22" letter-spacing="4">ASIAN KOEL</text><text x="55" y="568" font-size="17" font-style="italic">Eudynamys scolopaceus</text></g>
</svg>