<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Illustration of an Asian koel</title><desc id="desc">A dark male koel perched among tropical leaves against a warm green background.</desc>
<defs>
