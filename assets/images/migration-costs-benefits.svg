<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360"><rect width="900" height="360" rx="24" fill="#f0eee5"/><g font-family="Arial,sans-serif" fill="#203a31"><rect x="40" y="45" width="385" height="255" rx="20" fill="#dce8d6"/><rect x="475" y="45" width="385" height="255" rx="20" fill="#eadfce"/><text x="70" y="90" font-size="27" font-weight="bold">POTENTIAL BENEFITS</text><text x="70" y="135" font-size="21">• Seasonal food availability</text><text x="70" y="175" font-size="21">• Suitable breeding conditions</text><text x="70" y="215" font-size="21">• Reduced exposure to harsh periods</text><text x="505" y="90" font-size="27" font-weight="bold">POTENTIAL COSTS</text><text x="505" y="135" font-size="21">• Energy expenditure</text><text x="505" y="175" font-size="21">• Predation and severe weather</text><text x="505" y="215" font-size="21">• Stopover and habitat risks</text><text x="450" y="335" font-size="18" text-anchor="middle">Migration is favoured when benefits outweigh costs relative to alternatives.</text></g></svg>